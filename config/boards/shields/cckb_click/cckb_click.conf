# cckb-click。CCKB と同じ（各行の理由は docs/knowledge/zmk-and-xiao.md）。**違うのはデバウンスだけ**
CONFIG_ZMK_KEYBOARD_NAME="CCKB click"
CONFIG_SPI=y
# 既定は n。ボタン電池では桁が変わる（スリープ 2〜3µA・HHKB の実測）
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
# タクトスイッチ（Alps SKRAAWE010）: 仕様書 6.4「ON bounce 10 ms Max.・OFF bounce 10 ms Max.」。販売者も「打鍵方法によっては
# チャタリングが出る・調整を」と書いている。離す側を 10（跳ねている間に「離した」と見て 2 度打ちにしない）、押す側は 5。
# **実機で決め直す値**（projects/cckb-click/docs/open-gaps.md #6）。CCKB（Choc）は 3 / 5
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
# macOS は ZMK 既定（min 7.5ms）を Apple §58.6 違反として要求ごと捨てる
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
# 打ち止めを割ったら自分から止まる（firmware/src/low_battery_off.c）
CONFIG_ZMK_PM_SOFT_OFF=y
